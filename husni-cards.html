<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Showcase — Husni's Design</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    background: #f7f3e8;
    color: #101114;
    padding: 60px 40px;
    min-height: 100vh;
    background:
      linear-gradient(90deg, rgba(16,17,20,0.035) 1px, transparent 1px),
      linear-gradient(0deg, rgba(16,17,20,0.035) 1px, transparent 1px),
      #f7f3e8;
    background-size: 44px 44px;
  }

  .page { max-width: 960px; margin: 0 auto; }

  .eyebrow {
    color: #c74735;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h2 {
    font-size: clamp(34px, 5vw, 52px);
    line-height: 0.98;
    margin-bottom: 40px;
  }

  .work-stack {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .work-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 32px;
    padding: 40px;
    border-radius: 20px;
    background: radial-gradient(circle at top left, #ffffff, #fff6e8);
    box-shadow: 0 8px 40px rgba(31,28,20,0.10);
    border: 1px solid rgba(16,17,20,0.08);
    perspective: 1200px;
    transition: transform 300ms ease, box-shadow 300ms ease;
    cursor: default;
  }

  .work-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 60px rgba(31,28,20,0.14);
  }

  .icon-3d-wrap {
    width: 84px;
    height: 84px;
    perspective: 800px;
    flex-shrink: 0;
  }

  .icon-3d {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(135deg, #eef6ff, #e8f7ef);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    transform-style: preserve-3d;
    transition:
      transform 0.4s cubic-bezier(.2,.8,.2,1),
      box-shadow 0.4s;
    box-shadow:
      0 12px 30px rgba(0,0,0,0.12),
      inset 0 1px 0 rgba(255,255,255,0.6);
  }

  .work-card:hover .icon-3d {
    transform:
      translateY(-10px)
      rotateX(15deg)
      rotateY(-15deg)
      scale(1.05);
    box-shadow:
      0 28px 60px rgba(0,0,0,0.18),
      inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .content {
    flex: 1;
    min-width: 0;
  }

  .badges, .tags {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .badge {
    background: #edf3ff;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: #3d4a7d;
  }

  .badge-openclaw {
    background: #fef3c7;
    color: #7a5f1e;
  }

  .badge-whisper {
    background: #e0f2f1;
    color: #0f766e;
  }

  .badge-rag {
    background: #edf7e8;
    color: #4d6636;
  }

  .badge-bulb {
    background: #fef7e8;
    color: #7a5f1e;
    cursor: pointer;
    user-select: none;
  }

  .tag {
    border: 1px solid #e6e6e6;
    padding: 5px 12px;
    border-radius: 10px;
    font-size: 12px;
    color: #6f6a5f;
    background: rgba(255,250,240,0.6);
  }

  h3 {
    margin: 12px 0 4px;
    font-size: 24px;
    font-weight: 900;
  }

  .subtitle {
    color: #4f46e5;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 14px;
  }

  .description {
    max-width: 620px;
    line-height: 1.6;
    color: #444;
    font-size: 14px;
    margin-bottom: 16px;
  }

  /* Yeelight bulb */
  .bulb-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }

  .bulb-svg {
    width: 40px;
    height: 52px;
    cursor: pointer;
    transition: transform 200ms ease;
  }

  .bulb-svg:hover { transform: scale(1.1); }

  .bulb-svg.on #bulb-glass {
    fill: rgba(251,191,36,0.35);
    stroke: #f59e0b;
  }

  .bulb-svg.on #bulb-filament {
    stroke: #fef3c7;
  }

  .bulb-svg.on #bulb-glow-el {
    opacity: 0.35;
  }

  .bulb-label {
    font-size: 12px;
    color: #6f6a5f;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }

  .bulb-label.on { color: #b45309; }

  @media (max-width: 700px) {
    .work-card {
      flex-direction: column;
      align-items: flex-start;
      padding: 28px;
    }
    body { padding: 30px 16px; }
  }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">Selected Work</p>
  <h2>Showcase</h2>
  <div class="work-stack" id="work-stack"></div>
</div>

<script>
const projects = [
  {
    title: "Agent Harness",
    subtitle: "Autonomous AI operations",
    description:
      "Daily autonomous AI assistant running 24/7 — scheduled cron jobs, multi-agent delegation, cross-platform messaging, and MCP tool integration. Powers a fleet of 4 Freqtrade trading agents managing personal workflow automation end-to-end.",
    badges: [
      { text: "Hermes", cls: "" },
      { text: "OpenClaw", cls: "badge-openclaw" }
    ],
    tags: ["Python", "LLM APIs", "Cron", "MCP", "Freqtrade"],
    icon: "badges/agent-harness-3d.png"
  },
  {
    title: "Meeting Min",
    subtitle: "Bilingual AI transcription",
    description:
      "Self-hosted meeting intelligence for locked-down corporate environments. Captures Teams audio, transcribes Malay-English speech, generates structured summaries with local LLMs. Deployed through SSH tunneling to a remote inference server.",
    badges: [
      { text: "Whisper STT", cls: "badge-whisper" },
      { text: "Ollama", cls: "badge-whisper" }
    ],
    tags: ["Whisper", "Ollama", "Docker", "SSH", "Python"],
    icon: "badges/meeting-min-3d.png"
  },
  {
    title: "RAG Demo",
    subtitle: "Retrieval-augmented generation",
    description:
      "Full-stack RAG pipeline: document ingestion into ChromaDB vector store, semantic retrieval with local embeddings, and LLM-powered answer generation via Ollama. FastAPI backend, Docker-deployed on Oracle Cloud.",
    badges: [
      { text: "ChromaDB", cls: "badge-rag" },
      { text: "FastAPI", cls: "badge-rag" }
    ],
    tags: ["ChromaDB", "Ollama", "FastAPI", "Docker", "Oracle Cloud"],
    icon: "badges/rag-demo-3d.png"
  },
  {
    title: "Yeelight Backlight",
    subtitle: "Realtime physical automation",
    description:
      "Realtime screen-edge colour sampling piped to Yeelight bulbs over LAN TCP. Six iterations solving TCP buffer overflow with threaded sender + drop queue, temporal smoothing, dark mode fallback, and adaptive rate limiting.",
    badges: [
      { text: "Bulb", cls: "badge-bulb interactive-bulb" }
    ],
    tags: ["Python", "NumPy", "TCP", "MSS", "LAN"],
    icon: "badges/yeelight-3d.png",
    yeelight: true
  }
];

const container = document.getElementById("work-stack");

let bulbOn = false;
function toggleBulb() {
  bulbOn = !bulbOn;
  const svg = document.getElementById("bulb-svg");
  const label = document.getElementById("bulb-label");
  const badge = document.querySelector(".badge-bulb");
  if (svg) svg.classList.toggle("on", bulbOn);
  if (label) {
    label.textContent = bulbOn ? "💡 On" : "Click to toggle";
    label.classList.toggle("on", bulbOn);
  }
  if (badge) badge.textContent = bulbOn ? "💡 On" : "Bulb";
}

projects.forEach(p => {
  const card = document.createElement("div");
  card.className = "work-card";

  let badgesHtml = p.badges.map(b =>
    `<span class="badge ${b.cls}">${b.text}</span>`
  ).join("");

  let extraContent = "";
  if (p.yeelight) {
    extraContent = `
      <div class="bulb-row">
        <svg class="bulb-svg" id="bulb-svg" viewBox="0 0 40 52" fill="none" onclick="toggleBulb()">
          <defs>
            <radialGradient id="bg" cx="50%" cy="40%" r="50%">
              <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle id="bulb-glow-el" cx="20" cy="18" r="22" fill="url(#bg)" opacity="0"/>
          <path id="bulb-glass" d="M12 22C12 14 15 10 20 10C25 10 28 14 28 22L26 30C26 32 24 34 20 34C16 34 14 32 14 30L12 22Z" fill="rgba(16,17,20,0.06)" stroke="rgba(16,17,20,0.15)" stroke-width="1.5"/>
          <path id="bulb-filament" d="M18 18L20 23L22 18" stroke="rgba(16,17,20,0.2)" stroke-width="1.5" stroke-linecap="round"/>
          <rect x="16" y="34" width="8" height="7" rx="2" fill="#6f6a5f"/>
        </svg>
        <span class="bulb-label" id="bulb-label" onclick="toggleBulb()">Click to toggle</span>
      </div>`;
  }

  card.innerHTML = `
    <div class="icon-3d-wrap">
      <div class="icon-3d">${p.icon.includes('/') || p.icon.includes('.') ? `<img src="${p.icon}" alt="${p.title}" style="width:100%;height:100%;object-fit:contain;border-radius:20px;">` : p.icon}</div>
    </div>
    <div class="content">
      <div class="badges">${badgesHtml}</div>
      ${extraContent}
      <h3>${p.title}</h3>
      <p class="subtitle">${p.subtitle}</p>
      <p class="description">${p.description}</p>
      <div class="tags">
        ${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}
      </div>
    </div>
  `;

  container.appendChild(card);
});
</script>
</body>
</html>
